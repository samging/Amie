# Override with AMIE_BACKEND_PORT when Keycloak already holds 8080 on this machine
server.port=${AMIE_BACKEND_PORT:8080}
server.address=0.0.0.0

# PostgreSQL (Commented out because it was failing)
spring.datasource.url=jdbc:postgresql://localhost:5432/AmiesUsersDB
spring.datasource.username=samuel
spring.datasource.password=123
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Increase max file size for uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=100MB

# Network & Security
amie.cors.allowed-origins=http://localhost:8081

# Local File Paths
amie.local.download-path=Downloads/amiePackagesDownload/

amie.local.pkg-lock-file=/Users/samuel/Downloads/amieServicePackages.json

# Keycloak: tokens from the realm the website and the desktop app sign in against are accepted as bearer
# tokens. The issuer list (comma-separated) must contain the "iss" claim Keycloak writes: the realm's frontend
# URL + /realms/<realm>, or, for a realm without one, each address clients reach Keycloak on (the desktop app
# uses localhost, a browser on the LAN the machine's LAN address). The JWKS URI is where *this server* reaches
# the realm, which may be a different host than the issuer.
amie.keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8080/realms/master,http://127.0.0.1:8080/realms/master,http://192.168.1.114:8080/realms/master}
amie.keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/master/protocol/openid-connect/certs}

# The package store: the S3 bucket behind the Amie S3 service (awsS3 module). Every published file, each
# user's saved states (devices) and error log live there; this backend holds no AWS credentials itself.
amie.s3.service-url=${AMIE_S3_SERVICE_URL:http://localhost:8088}
# The website, for the links in package listings
amie.site-url=${AMIE_SITE_URL:http://localhost:8081}
# How long calls to the S3 service may take (large package files)
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=120s

# Administration: the Keycloak role (realm or client role) an access token must carry for the /admin routes
amie.admin-role=${AMIE_ADMIN_ROLE:admin}
amie.keycloak.client-id=amie

# Timeouts and connection limits (against slow-loris and floods): how long Tomcat waits for a request
# line and headers, how long an idle keep-alive connection lives, how many connections and threads at most
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=15s
server.tomcat.max-keep-alive-requests=100
server.tomcat.max-connections=500
server.tomcat.accept-count=100
server.tomcat.threads.max=64
server.max-http-request-header-size=16KB
server.tomcat.max-part-count=20
spring.mvc.async.request-timeout=60s

# Per-client rate limits (shared/security/RateLimitFilter.kt): calls a minute per address
amie.ratelimit.enabled=true
amie.ratelimit.signin-per-minute=10
amie.ratelimit.upload-per-minute=20
amie.ratelimit.write-per-minute=60
amie.ratelimit.read-per-minute=300
# Count the X-Forwarded-For address when the caller is the website's server (localhost / private network)
amie.ratelimit.trust-forwarded=true
