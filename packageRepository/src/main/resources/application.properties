# Override with AMIE_BACKEND_PORT when Keycloak already holds 8080 on this machine
server.port=${AMIE_BACKEND_PORT:8080}
server.address=0.0.0.0

# PostgreSQL (Commented out because it was failing)
spring.datasource.url=jdbc:postgresql://localhost:5432/AmiesUsersDB
spring.datasource.username=samuel
spring.datasource.password=123
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Increase max file size for uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=100MB

# GitHub configuration
amie.github.owner=samging
amie.github.repo=codeRepository
amie.github.base-path=uploads
amie.github.github-api-base=https://api.github.com/repos
amie.github.url-segment=contents

# Network & Security
amie.cors.allowed-origins=http://localhost:8081

# Local File Paths
amie.local.download-path=Downloads/amiePackagesDownload/

amie.local.pkg-lock-file=/Users/samuel/Downloads/amieServicePackages.json

# Keycloak: tokens from the realm the website and the desktop app sign in against are accepted as bearer
# tokens. The issuer must equal the "iss" claim Keycloak writes (realm frontend URL + /realms/<realm>);
# the JWKS URI is where *this server* can reach the realm, which may be a different host than the issuer.
amie.keycloak.issuer=${KEYCLOAK_ISSUER:http://192.168.1.114:8080/realms/master}
amie.keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/master/protocol/openid-connect/certs}

# Amie S3 service (awsS3 module): validated package jars are mirrored there for the website's downloads page.
# Leave empty to disable mirroring.
amie.s3.service-url=${AMIE_S3_SERVICE_URL:http://localhost:8088}
