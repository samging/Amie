spring.application.name=awsS3

spring.cloud.aws.region.static=eu-north-1
spring.cloud.aws.credentials.profile.name=default
aws.s3.bucket-name=setup-demo-sams
server.port=8088

# Jar downloads (see jar/JarService.kt): objects under this prefix ending in .jar are listed and served
amie.jars.prefix=
# Application builds (the desktop app) live under this prefix and are listed as kind "application"
amie.jars.releases-prefix=releases/
# How long the bucket listing and the jar bytes stay cached in memory, and the memory budget for jar bytes
amie.jars.listing-ttl-seconds=60
amie.jars.content-ttl-seconds=3600
amie.jars.max-cache-bytes=268435456

# Where clients (the website, the desktop app) reach this service; listings carry download URLs built on it
amie.public-url=${AMIE_S3_PUBLIC_URL:http://localhost:8088}
